# AI 운영자 예약 실행 — 평일 한국시간 9~20시 30분마다 https://upjong.com/api/ai {op:'run'} 호출 (실제 일은 Pages 함수가 함)
# 2026-11-18: 5분마다 → 30분마다(평일 UTC 0~11시)로 줄임 — Upstash 월 요청 한도 대응. AI 글 생성은 중단 상태(api/_aiPause.js)라 공시 모으기만 함. 원래대로: "*/5 * * * *"
# 배포: cd workers/ai-cron && npx wrangler deploy  ·  시크릿: npx wrangler secret put CRON_KEY (Pages의 CRON_KEY와 같은 값)
name = "upjong-ai-cron"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = false

[triggers]
crons = ["*/30 0-11 * * 1-5"]
